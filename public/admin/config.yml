# =============================================================================
# Sveltia CMS Configuration — SteamHead
# Docs: https://github.com/sveltia/sveltia-cms
# =============================================================================

backend:
  name: github
  repo: SteamHead/steamhead-site-rebuild
  branch: main
  # OAuth handler — Sveltia CMS auth worker on Cloudflare
  base_url: https://sveltia-cms-auth.james-068.workers.dev

# Where uploaded images are stored in the repo
media_folder: public/images/uploads
# How those images are referenced in content (public/ is stripped at build time)
public_folder: /images/uploads

# =============================================================================
# COLLECTIONS
# Each collection maps to a folder of Markdown files that staff can edit.
# =============================================================================

collections:

  # ---------------------------------------------------------------------------
  # BLOG — Great Things Blog
  # Staff can create, edit, and delete posts here.
  # ---------------------------------------------------------------------------
  - name: blog
    label: Blog Posts
    label_singular: Blog Post
    folder: src/content/blog
    create: true
    delete: true
    # Filename = URL slug (/blog/<slug>/). Migrated posts keep their old
    # WordPress post-name so redirects stay one-to-one.
    slug: "{{slug}}"
    preview_path: "/blog/{{slug}}"
    fields:
      - { label: Title,             name: title,       widget: string }
      - { label: "Publish Date",    name: date,        widget: datetime }
      - { label: Description,       name: description, widget: text,
          hint: "One or two sentences — shown on the blog index and in search results" }
      - { label: Author,            name: author,      widget: string }
      - label: Program
        name: program
        widget: select
        options:
          - { label: "General",           value: general }
          - { label: "MakeFashion Edu",   value: makefashion-edu }
          - { label: "Neighborhood Earth", value: neighborhood-earth }
          - { label: "System Upgrade",    value: system-upgrade }
        default: general
      - label: Categories
        name: categories
        widget: list
        required: false
        field: { label: Category, name: category, widget: string }
      - label: "Featured Image"
        name: image
        widget: image
        required: false
        hint: "Recommended: 1200×630px"
      - { label: "Image Alt Text",  name: imageAlt,    widget: string,   required: false }
      - { label: Draft,             name: draft,       widget: boolean,  default: false,
          hint: "Drafts are saved but never published to the site" }
      - { label: Body,              name: body,        widget: markdown }

  # ---------------------------------------------------------------------------
  # PEOPLE — SteamHead Team & Residents profiles
  # Migrated from the old blog's Team/Residents category posts.
  # These never appear in the blog; how they display on the site is TBD.
  # ---------------------------------------------------------------------------
  - name: people
    label: People
    label_singular: Person
    folder: src/content/people
    create: true
    delete: true
    slug: "{{slug}}"
    fields:
      - { label: Name,              name: name,        widget: string }
      - label: Role
        name: role
        widget: select
        options:
          - { label: "SteamHead Team",     value: team }
          - { label: "SteamHead Resident", value: resident }
      - { label: "Original Title",  name: title,       widget: string,   required: false,
          hint: "Only if the profile post had a title beyond the person's name" }
      - { label: Date,              name: date,        widget: datetime }
      - { label: Description,       name: description, widget: text,     required: false }
      - { label: Photo,             name: image,       widget: image,    required: false }
      - { label: "Photo Alt Text",  name: imageAlt,    widget: string,   required: false }
      - { label: Draft,             name: draft,       widget: boolean,  default: false }
      - { label: Body,              name: body,        widget: markdown }

  # ---------------------------------------------------------------------------
  # PAGES — editable copy for the 6 main pages
  # Each page is a single file; staff edit the text fields, not the layout.
  # ---------------------------------------------------------------------------
  - name: pages
    label: Pages
    files:

      - name: home
        label: Home Page
        file: src/content/pages/home.md
        fields:
          - { label: "Hero Heading",   name: hero_heading,  widget: string }
          - { label: "Hero Tagline",   name: hero_tagline,  widget: text }

      - name: about
        label: About Us Page
        file: src/content/pages/about.md
        fields:
          - { label: "Mission",        name: mission,  widget: text }
          - { label: "Vision",         name: vision,   widget: text }
          - label: Values
            name: values
            widget: list
            field: { label: Value, name: value, widget: string }
          - { label: "About Us Body",  name: body,     widget: markdown }
          - { label: "Funding Text",   name: funding,  widget: markdown }

      - name: makefashion-edu
        label: MakeFashion Edu Page
        file: src/content/pages/makefashion-edu.md
        fields:
          - { label: "Hero Title",     name: hero_title,     widget: string }
          - { label: "Hero Tagline",   name: hero_tagline,   widget: text }
          - { label: "Engineering + Fashion", name: engineering_text, widget: markdown }
          - { label: "Heritage (origin story)", name: heritage_text, widget: markdown,
              hint: "Must stay word-for-word identical to the heritage section on makefashion.ca/edu" }
          - { label: "Runway Text",    name: runway_text,    widget: markdown }
          - { label: "Classes Text",   name: classes_text,   widget: markdown }
          - { label: "Get In Touch",   name: getintouch_text, widget: markdown }
          - label: "Publishing Channels"
            name: publishing
            widget: list
            hint: "The MakeFashion Edu Publishing cards (Instagram / YouTube / Facebook)"
            fields:
              - { label: Name,  name: name,  widget: string }
              - { label: URL,   name: url,   widget: string }
              - { label: Image, name: image, widget: image }

      - name: neighborhood-earth
        label: Neighborhood Earth Page
        file: src/content/pages/neighborhood-earth.md
        fields:
          - { label: "Hero Tagline",   name: hero_tagline,   widget: text }
          - { label: "Intro Body",     name: intro_body,     widget: markdown }
          - { label: "MMS Description", name: mms_body,     widget: markdown }
          - { label: "Virtual Space Text", name: virtual_body, widget: markdown }
          - { label: "Makerspace History", name: makerspace_body, widget: markdown }

      - name: system-upgrade
        label: System Upgrade Page
        file: src/content/pages/system-upgrade.md
        fields:
          - { label: "Hero Tagline",   name: hero_tagline,   widget: text }
          - { label: "Intro Text",     name: intro_text,     widget: text }
          - { label: "SFUSD Body",     name: sfusd_body,     widget: markdown }
          - { label: "Productions Body", name: productions_body, widget: markdown }
          - { label: "Course Body",    name: course_body,    widget: markdown }
          - { label: "Badges Body",    name: badges_body,    widget: markdown }

      - name: shelf
        label: The Shelf Page
        file: src/content/pages/shelf.md
        fields:
          - { label: "Hero Tagline",   name: hero_tagline,   widget: text }
          - { label: "SHTEAM Labs Description", name: shteam_body, widget: markdown }
          - { label: "Course Description",      name: course_body, widget: markdown }
          - label: "Hardware Items"
            name: hardware
            widget: list
            fields:
              - { label: Name,        name: name,        widget: string }
              - { label: Description, name: description, widget: string }
              - { label: URL,         name: url,         widget: string }
          - label: "Books"
            name: books
            widget: list
            fields:
              - { label: Title,         name: title, widget: string }
              - { label: "Cover Image", name: image, widget: image,  required: false,
                  hint: "Portrait book cover; a styled placeholder shows until one is added" }
              - { label: "Buy/View URL", name: url,  widget: string, required: false }

  # ---------------------------------------------------------------------------
  # SITE SETTINGS — global info edited in one place
  # ---------------------------------------------------------------------------
  - name: settings
    label: Site Settings
    files:

      - name: general
        label: General
        file: src/content/settings/general.md
        fields:
          - { label: "Organisation Name", name: org_name,     widget: string }
          - { label: "Tagline",           name: tagline,      widget: string }
          - { label: "Mission Statement", name: mission,      widget: text }
          - { label: "Facebook URL",      name: facebook_url, widget: string }
          - { label: "Contact Page URL",  name: contact_url,  widget: string }
          - { label: "Support URL",       name: support_url,  widget: string }
