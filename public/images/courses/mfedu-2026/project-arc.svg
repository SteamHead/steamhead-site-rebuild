<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 200" role="img" aria-labelledby="t">
  <title id="t">The course arc: Find Your Story, Research It, Design It, Light It Up, Build It, Show It</title>
  <style>
    .n { font: 800 26px 'Montserrat', sans-serif; fill: #111111; }
    .h { font: 700 17px 'Montserrat', sans-serif; fill: #474747; }
  </style>
  <rect width="960" height="200" fill="none"/>
  <path d="M80 100 H880" stroke="#D7D7D7" stroke-width="8" stroke-linecap="round"/>
  <g>
    <circle cx="80" cy="100" r="42" fill="#F1D302"/><text class="n" x="72" y="110">1</text>
    <text class="h" x="35" y="175">Find Your</text><text class="h" x="52" y="195">Story</text>
  </g>
  <g>
    <circle cx="240" cy="100" r="42" fill="#F2B705"/><text class="n" x="232" y="110">2</text>
    <text class="h" x="196" y="175">Research</text><text class="h" x="235" y="195">It</text>
  </g>
  <g>
    <circle cx="400" cy="100" r="42" fill="#EDA83E"/><text class="n" x="392" y="110">3</text>
    <text class="h" x="365" y="175">Design</text><text class="h" x="395" y="195">It</text>
  </g>
  <g>
    <circle cx="560" cy="100" r="42" fill="#EF7B44"/><text class="n" x="552" y="110">4</text>
    <text class="h" x="512" y="175">Light It</text><text class="h" x="548" y="195">Up</text>
  </g>
  <g>
    <circle cx="720" cy="100" r="42" fill="#409FCD"/><text class="n" x="712" y="110">5</text>
    <text class="h" x="690" y="175">Build</text><text class="h" x="715" y="195">It</text>
  </g>
  <g>
    <circle cx="880" cy="100" r="42" fill="#5EB1BF"/><text class="n" x="872" y="110">6</text>
    <text class="h" x="848" y="175">Show</text><text class="h" x="875" y="195">It</text>
  </g>
</svg>
